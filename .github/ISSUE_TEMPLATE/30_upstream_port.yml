name: Upstream port
description: Evaluate a selected upstream Zed fix for NeoZed.
labels: ["neozed:upstream-port", "state:needs triage"]
body:
  - type: textarea
    id: source
    attributes:
      label: Upstream source
      description: Link upstream PR, commit, issue, release note, or advisory.
      placeholder: |
        - Upstream PR:
        - Commit(s):
        - Release:
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason to port
      description: Why does NeoZed need this fix?
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Bug fix
        - Security fix
        - Build fix
        - Crash fix
        - Data loss fix
        - Other
    validations:
      required: true
  - type: textarea
    id: neozed_impact
    attributes:
      label: NeoZed impact
      description: Evidence that the issue exists in NeoZed, or why it should be preemptively ported.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependency risk
      description: Does the fix depend on post-base upstream features or refactors?
      placeholder: |
        - Depends on post-base feature stack: yes/no/unknown
        - Expected conflicts:
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Required verification
      value: |
        - Targeted test:
        - Build:
        - Manual verification:
    validations:
      required: true
