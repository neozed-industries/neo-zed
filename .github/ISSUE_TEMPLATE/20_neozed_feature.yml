name: NeoZed feature
description: Track a product feature added on top of Zed.
labels: ["neozed:feature", "state:needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for NeoZed product behavior. This issue is the durable source of truth for agent work.
  - type: textarea
    id: intent
    attributes:
      label: Product intent
      description: What should NeoZed users be able to do after this ships?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem, workflow gap, or product bet does this address?
    validations:
      required: true
  - type: textarea
    id: ux_research
    attributes:
      label: UX research
      description: Does this fit Zed's design language? Check the `ui` crate for existing components. Search upstream Zed issues for prior art. Use `graphify-out/` to traverse the codebase graph before assuming something doesn't exist.
      placeholder: |
        - Fits Zed design language because:
        - Existing components reused:
        - Upstream prior art:
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Architecture
      description: |
        Sketch the approach before any code is written. This section must be reviewed and approved before implementation starts.
        - Which crates and files are touched?
        - What data is already available vs needs to be added?
        - Check other code instances for the pattern you plan to use.
        - If UI: provide HTML/CSS mockups in References before implementing.
      placeholder: |
        - Crates/files touched:
        - Data available:
        - Pattern reference:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete behavior that must be true before this can merge.
      placeholder: |
        - Acceptance criterion
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What should agents avoid adding while implementing this?
      placeholder: |
        - Non-goal
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Required proof
      description: Build, test, screenshot, or recording evidence required in the PR.
      value: |
        - Build/test: run `cargo fmt --all -- --check`; run `cargo check --workspace --all-targets` and fix every warning and error before committing; run focused clippy/tests for changed crates.
        - Screenshot: for UI proof, run `script/bundle-mac -d -i -o` from the repo root to build, install, and open `/Applications/Neo Zed.app`; then use the Computer Use plugin to interact with that installed app window and capture window screenshots. Attach screenshots to the PR conversation. Never commit screenshots to the repo.
        - Screen recording:
        - Manual verification:
        - Commit discipline: keep commits atomic. If `cargo check --workspace --all-targets` reveals pre-existing or cleanup-only warnings/errors, fix and commit those separately before committing the feature changes. Do not combine warning/error cleanup with the feature implementation commit unless the warning/error is directly caused by that implementation.
        - If stuck: stop immediately and ask rather than guessing or straying from scope.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        Designs (HTML/CSS mockups for UI changes), screenshots, prior art, related issues, or notes.
        Tip: use `graphify-out/wiki/` or `graphify query "<concept>"` to find related code before grepping.
    validations:
      required: false
