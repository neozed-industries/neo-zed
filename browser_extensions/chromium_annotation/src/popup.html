<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zed Browser Annotation</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Zed Comments</h1>
          <p id="page-title">Current tab</p>
        </div>
      </header>

      <section class="toggle-row">
        <strong>Comment mode</strong>
        <button id="comment-mode" class="switch" type="button" role="switch" aria-checked="false">
          <span></span>
        </button>
      </section>

      <section class="summary">
        <span id="comment-count">0 comments</span>
        <button id="clear" type="button">Clear all</button>
      </section>

      <section id="comments" class="comments" aria-live="polite"></section>

      <button id="send" class="primary" type="button">Send all to Zed</button>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="shared_core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
